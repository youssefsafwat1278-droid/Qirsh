# Codemagic CI/CD — Mali (money_companion)
#
# The Flutter project lives in ./app, so every app workflow sets
# `working_directory: app`. Four workflows are provided:
#
#   1. ios-unsigned-sideload  -> builds an UNSIGNED .ipa for Sideloadly / iLoader.
#                                No Apple Developer account needed at build time;
#                                Sideloadly re-signs with your free Apple ID.
#   2. ios-signed-release     -> builds a SIGNED .ipa via Codemagic code signing
#                                (needs an Apple Developer Program account).
#   3. android-release        -> builds a release .aab; mirrors the production
#                                config assertions (MALI-036).
#   4. backend-and-quality-gates -> SQL/migration lint, Edge-function Deno tests,
#                                admin panel lint/build, flutter analyze/test —
#                                the backend/SQL/RLS/Edge/admin gates the CI was
#                                missing (MALI-036). No device build.
#
# Supabase: SUPABASE_URL, SUPABASE_ANON_KEY, and SUPABASE_ENV are injected as --dart-define.
# These are PRODUCTION workflows: both assert the Supabase values are non-empty
# before building, and the app itself fails closed at startup in release mode
# if they are missing (bootstrap_runner._assertRuntimeConfig) — release builds
# must never fall back to stub auth. Staging must use a separate workflow and
# pass --dart-define=SUPABASE_ENV=staging explicitly.

workflows:
  # ---------------------------------------------------------------------------
  # 1) UNSIGNED IPA for sideloading (Sideloadly / iLoader). Recommended default.
  # ---------------------------------------------------------------------------
  ios-unsigned-sideload:
    name: iOS Unsigned IPA (Sideload)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - supabase
      flutter: 3.47.3
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.youssefsafwat.mali"
        # One explicit output path is used for stamping, verification, artifact
        # collection, and email publication. It is never wildcard-selected.
        IOS_UNSIGNED_IPA: "app/money_companion-unsigned.ipa"
    scripts:
      - name: Flutter pub get
        working_directory: app
        script: flutter pub get

      - name: Regenerate localizations
        working_directory: app
        script: flutter gen-l10n

      # Audit H-15: even the unsigned sideload IPA is a production-configured,
      # distributable RELEASE artifact, so it runs the same canonical gate before
      # the build — a mandatory-gate failure makes the build and packaging below
      # unreachable.
      - name: Canonical gates (tools/ci_gates.sh, strict) — REQUIRED before build
        script: |
          set -eu
          if ! command -v deno >/dev/null 2>&1; then
            curl -fsSL https://deno.land/install.sh | sh
            export PATH="$HOME/.deno/bin:$PATH"
          fi
          ( cd admin && npm ci )
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db 2>/dev/null || true
          # The canonical gate runs with the Supabase build credentials UNSET.
          #
          # They belong to the build step, not to a code-correctness gate. With
          # them visible here the skip/ignore manifest fails honestly and
          # unhelpfully: the workflow supplies SUPABASE_URL and
          # SUPABASE_ANON_KEY but no SUPABASE_SERVICE_ROLE_KEY, so the
          # `supabaseServiceRole` group is half-configured and the checker
          # rejects it with "configure all or none" — which is the rule working,
          # not a false positive. Unsetting them makes this step see the same
          # credential state it sees locally and on GitHub, where the manifest is
          # satisfied. The manifest keeps every tooth: an unexpected skip, a
          # changed reason, a stale pattern or a re-quarantined known failure all
          # still fail. The build step below is untouched and still receives the
          # real values.
          env -u SUPABASE_URL -u SUPABASE_ANON_KEY -u SUPABASE_SERVICE_ROLE_KEY \
            REQUIRE_ALL_GATES=1 bash tools/ci_gates.sh

      - name: Assert production Supabase config
        script: |
          set -e
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: SUPABASE_URL / SUPABASE_ANON_KEY are empty — a production"
            echo "build must never ship without a real backend (stub-auth risk)."
            exit 1
          fi

      - name: Build unsigned iOS (.app)
        working_directory: app
        script: |
          # SUPABASE_* come from the "supabase" group; asserted non-empty above.
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}" \
            --dart-define=SUPABASE_ENV=production \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}" \
            --dart-define=LEGAL_BASE_URL="${LEGAL_BASE_URL:-}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=QIRSH_GOOGLE_AUTH_ENABLED="${QIRSH_GOOGLE_AUTH_ENABLED:-false}" \
            --dart-define=QIRSH_EMAIL_AUTH_ENABLED="${QIRSH_EMAIL_AUTH_ENABLED:-false}" \
            --dart-define=QIRSH_ALTERNATE_SIGNUP_ENABLED="${QIRSH_ALTERNATE_SIGNUP_ENABLED:-true}" \
            --dart-define=APP_VERSION="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)"

      - name: Package .app into unsigned .ipa
        working_directory: app
        script: |
          set -eu
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found at $APP_PATH" && exit 1
          fi
          IPA="$CM_BUILD_DIR/$IOS_UNSIGNED_IPA"
          rm -rf Payload
          rm -f "$IPA" "$IPA.provenance"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q "$IPA" Payload
          rm -rf Payload
          echo "Built the single explicit unsigned artifact: $IPA"

      # Provenance is produced after final packaging and before verification. It
      # remains external, and its SHA-256 binds the exact immutable IPA bytes.
      - name: Stamp and verify the EXACT packaged IPA — REQUIRED before email
        working_directory: app
        script: |
          set -eu
          IPA="$CM_BUILD_DIR/$IOS_UNSIGNED_IPA"
          bash ../tools/stamp_ios_provenance.sh "$IPA"
          bash ../tools/verify_ios_release_artifact.sh "$IPA"
    artifacts:
      - $IOS_UNSIGNED_IPA
      - ${IOS_UNSIGNED_IPA}.provenance
      - app/build/ios/iphoneos/Runner.app
      - app/build/**/outputs/**/*.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - youssefsafwat1278@gmail.com   # change as needed
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 2) SIGNED IPA via Codemagic code signing (needs Apple Developer Program).
  # ---------------------------------------------------------------------------
  ios-signed-release:
    name: iOS Signed IPA (Ad Hoc / App Store)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic_asc_api_key   # name of the ASC API key in Codemagic
    environment:
      groups:
        - supabase
        # Production AdMob identifiers. Attached to the two SIGNED release
        # workflows only — never to the quality gate (a guard enforces that) and
        # never to the unsigned sideload, which is a test artifact.
        # Absence stays safe: every ADMOB_* define below tolerates an empty
        # value, so a build without this group serves no ads rather than failing.
        - admob
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.youssefsafwat.mali
      # Must match the SDK the lockfile was resolved with.
      #
      # 3.44.2 ships flutter_localizations pinned to intl 0.20.2, while this
      # project resolves against 3.47.3, whose flutter_localizations pins
      # intl ^0.20.3. `pub get` therefore failed on Codemagic with a version
      # solve that CANNOT succeed whatever the app declares — the conflict is
      # between two SDK-pinned constraints, not between the app and a package.
      # The fix is to build on the SDK that produced pubspec.lock rather than
      # bend the app down to an older framework.
      flutter: 3.47.3
      xcode: latest
      cocoapods: default
      vars:
        # Candidate discovery must yield exactly one IPA. It is then renamed
        # without changing bytes to this single publication path.
        IOS_RELEASE_IPA: "app/build/ios/ipa/money_companion-signed.ipa"
    scripts:
      - name: Flutter pub get
        working_directory: app
        script: flutter pub get

      - name: Resolve next iOS build number from App Store Connect
        script: |
          set -eu
          MARKETING_VERSION="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)"
          [ -n "$MARKETING_VERSION" ] || {
            echo "ERROR: could not read the marketing version from app/pubspec.yaml."
            exit 1
          }

          # The configured Codemagic integration supplies the App Store Connect
          # credentials. Discover the non-secret Apple app id from the exact
          # production bundle id so it cannot drift or require another secret.
          APP_JSON="$(app-store-connect apps list --silent --json \
            --bundle-id-identifier com.youssefsafwat.mali \
            --strict-match-identifier)"
          APP_STORE_APPLE_ID="$(printf '%s' "$APP_JSON" | python3 -c 'import json, sys; payload = json.load(sys.stdin); items = payload if isinstance(payload, list) else payload.get("data", []); ids = [str(item.get("id", "")) for item in items if item.get("id")]; len(ids) == 1 or sys.exit(f"expected exactly one App Store Connect app, found {len(ids)}"); print(ids[0])')"

          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-build-number \
            --silent --platform IOS --version-string "$MARKETING_VERSION" \
            "$APP_STORE_APPLE_ID")"
          case "$LATEST_BUILD_NUMBER" in
            ''|*[!0-9]*)
              echo "ERROR: App Store Connect did not return a numeric build number."
              exit 1
              ;;
          esac
          IOS_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          printf 'IOS_MARKETING_VERSION=%s\nIOS_BUILD_NUMBER=%s\n' \
            "$MARKETING_VERSION" "$IOS_BUILD_NUMBER" >> "$CM_ENV"
          echo "App Store Connect preflight: $MARKETING_VERSION ($LATEST_BUILD_NUMBER) exists; building ($IOS_BUILD_NUMBER)."

      # Audit H-15: the canonical gate runs BEFORE any signing material is set up
      # or any artifact is built, so a mandatory-gate failure structurally makes
      # provisioning, the signed build, and the TestFlight submission below
      # unreachable (Codemagic aborts the workflow on a non-zero step). Same
      # authority (tools/ci_gates.sh) as GitHub + the quality workflow; strict so
      # a missing tool cannot hollow-pass a release gate.
      - name: Canonical gates (tools/ci_gates.sh, strict) — REQUIRED before signing
        script: |
          set -eu
          if ! command -v deno >/dev/null 2>&1; then
            curl -fsSL https://deno.land/install.sh | sh
            export PATH="$HOME/.deno/bin:$PATH"
          fi
          ( cd admin && npm ci )
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db 2>/dev/null || true
          # The canonical gate runs with the Supabase build credentials UNSET.
          #
          # They belong to the build step, not to a code-correctness gate. With
          # them visible here the skip/ignore manifest fails honestly and
          # unhelpfully: the workflow supplies SUPABASE_URL and
          # SUPABASE_ANON_KEY but no SUPABASE_SERVICE_ROLE_KEY, so the
          # `supabaseServiceRole` group is half-configured and the checker
          # rejects it with "configure all or none" — which is the rule working,
          # not a false positive. Unsetting them makes this step see the same
          # credential state it sees locally and on GitHub, where the manifest is
          # satisfied. The manifest keeps every tooth: an unexpected skip, a
          # changed reason, a stale pattern or a re-quarantined known failure all
          # still fail. The build step below is untouched and still receives the
          # real values.
          env -u SUPABASE_URL -u SUPABASE_ANON_KEY -u SUPABASE_SERVICE_ROLE_KEY \
            REQUIRE_ALL_GATES=1 bash tools/ci_gates.sh

      - name: Set up provisioning profiles
        # THREE bundle ids exist in this project, not one:
        #   com.youssefsafwat.mali                    (Runner)
        #   com.youssefsafwat.mali.ShareBankMessage   (share extension, a
        #                                              SEPARATE signed binary)
        #   com.youssefsafwat.mali.RunnerTests        (test host, not shipped)
        #
        # `ios_signing.bundle_identifier` above names only the main app.
        # `use-profiles` applies whatever profiles the ASC integration fetched,
        # so the EXTENSION needs its own App ID and distribution profile in the
        # Apple Developer portal, and BOTH App IDs need the App Group capability
        # for `group.com.youssefsafwat.mali` — the extension and the app share one
        # container, and that is how a shared bank message reaches the app.
        # A missing extension profile fails at export, not at compile.
        script: |
          xcode-project use-profiles

      - name: Assert production Supabase config
        script: |
          set -e
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: SUPABASE_URL / SUPABASE_ANON_KEY are empty — a production"
            echo "build must never ship without a real backend (stub-auth risk)."
            exit 1
          fi

      - name: Materialise AdMob release config (native)
        working_directory: app
        script: |
          # The iOS App ID must reach Info.plist via a build setting; dart-define
          # alone cannot. Release.xcconfig has an optional `#include? AdMob.xcconfig`,
          # so writing this file supplies ADMOB_APP_ID_IOS to the native build.
          # The file is gitignored and is never committed. If the variable is
          # unset we write nothing: the build then ships with an empty app id and
          # Dart holds ads closed.
          if [ -n "${ADMOB_APP_ID_IOS:-}" ]; then
            printf 'ADMOB_APP_ID_IOS=%s\n' "$ADMOB_APP_ID_IOS" > ios/Flutter/AdMob.xcconfig
            echo "AdMob iOS app id supplied to the native build (value not printed)."
          else
            rm -f ios/Flutter/AdMob.xcconfig
            echo "No ADMOB_APP_ID_IOS provided — building with ads unconfigured (fail closed)."
          fi

      - name: Build signed IPA
        working_directory: app
        script: |
          set -eu
          # AdMob (R7 I3): release inputs are environment-provided, never
          # committed. The App ID must reach BOTH Dart (which decides ad
          # eligibility) and the native Info.plist (which the SDK reads) — the
          # latter via the AdMob.xcconfig step above. Absent values are legal:
          # the build then has NO ad configuration and report export simply
          # runs without ads.
          # Remove only the prior export directory before codesign/export so a
          # stale single IPA cannot masquerade as output from this build.
          rm -rf build/ios/ipa
          flutter build ipa --release \
            --build-name="$IOS_MARKETING_VERSION" \
            --build-number="$IOS_BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}" \
            --dart-define=SUPABASE_ENV=production \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}" \
            --dart-define=LEGAL_BASE_URL="${LEGAL_BASE_URL:-}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=QIRSH_GOOGLE_AUTH_ENABLED="${QIRSH_GOOGLE_AUTH_ENABLED:-false}" \
            --dart-define=QIRSH_EMAIL_AUTH_ENABLED="${QIRSH_EMAIL_AUTH_ENABLED:-false}" \
            --dart-define=QIRSH_ALTERNATE_SIGNUP_ENABLED="${QIRSH_ALTERNATE_SIGNUP_ENABLED:-true}" \
            --dart-define=APP_VERSION="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)" \
            --dart-define=ADMOB_APP_ID_IOS="${ADMOB_APP_ID_IOS:-}" \
            --dart-define=ADMOB_INTERSTITIAL_IOS="${ADMOB_INTERSTITIAL_IOS:-}" \
            --dart-define=ADMOB_BANNER_IOS="${ADMOB_BANNER_IOS:-}" \
            --export-options-plist=/Users/builder/export_options.plist

      # Resolve the export exactly once. Zero or multiple candidates fail before
      # provenance or publishing. A metadata-only rename gives Codemagic one
      # explicit path; hashes prove the signed bytes survive it unchanged.
      # Provenance is then produced at build time, before a verifier requires it.
      - name: Resolve, stamp, and verify the EXACT signed IPA — REQUIRED before submit
        working_directory: app
        script: |
          set -eu
          IPA_DIR="$CM_BUILD_DIR/app/build/ios/ipa"
          CANDIDATE="$(bash ../tools/verify_ios_release_artifact.sh --resolve-only "$IPA_DIR")"
          PUBLISH_DIR="$(cd "$(dirname "$CM_BUILD_DIR/$IOS_RELEASE_IPA")" && pwd -P)"
          IPA="$PUBLISH_DIR/$(basename "$IOS_RELEASE_IPA")"
          SHA_BEFORE_MOVE="$(shasum -a 256 "$CANDIDATE" | awk '{print $1}')"
          if [ "$CANDIDATE" != "$IPA" ]; then
            [ ! -e "$IPA" ] || { echo "ERROR: canonical IPA path already exists: $IPA"; exit 1; }
            mv "$CANDIDATE" "$IPA"
          fi
          SHA_AFTER_MOVE="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          [ "$SHA_AFTER_MOVE" = "$SHA_BEFORE_MOVE" ] || {
            echo "ERROR: signed IPA bytes changed while assigning the publication path."
            exit 1
          }
          bash ../tools/stamp_ios_provenance.sh "$IPA"
          bash ../tools/verify_ios_release_artifact.sh "$IPA"
    artifacts:
      # App Store Connect receives the only collected .ipa: the exact path above.
      - $IOS_RELEASE_IPA
      - ${IOS_RELEASE_IPA}.provenance
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # AUTO-SUBMIT IS ON — 2026-09-26, for the 1.0.0 (41) TestFlight release.
      #
      # It was turned OFF on 2026-09-04 because submission was not authorised, no
      # iOS build had been exercised on a physical device, and until 2026-09-03
      # the app did not compile for iOS at all. That note said to re-enable this
      # "only when submission is explicitly authorised".
      #
      # All three have now changed: the owner authorised TestFlight upload for
      # this build, 1.0.0 (41) was exercised on a physical iPhone 13 through the
      # isolated QA instance, and iOS Release builds clean.
      #
      # TESTFLIGHT ONLY — this uploads for internal distribution and does NOT
      # submit for App Review. If a later build is not authorised for upload, set
      # this back to false rather than relying on the run being noticed.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - youssefsafwat1278@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 3) ANDROID release App Bundle. Mirrors the iOS production config assertions
  #    so a broken Android/backend combination can't ship green (MALI-036).
  # ---------------------------------------------------------------------------
  android-release:
    name: Android Release (App Bundle)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - supabase
        # Upload-key material + credentials, set in Codemagic (never in source):
        #   ANDROID_KEYSTORE_BASE64    base64 of the UPLOAD keystore (.jks)
        #   ANDROID_KEYSTORE_PASSWORD  store password
        #   ANDROID_KEY_ALIAS          key alias
        #   ANDROID_KEY_PASSWORD       key password
        # ANDROID_KEYSTORE_PATH is NOT stored — it is produced by the
        # materialisation step below and exported for build.gradle.kts.
        - google_play
        # Production AdMob identifiers. Signed release workflows only.
        # ADMOB_APP_ID_ANDROID is read by build.gradle.kts from the ENVIRONMENT
        # as well as passed as a dart-define, so the group must be attached here
        # for the native side to see it at all. A malformed value fails the
        # Gradle build; Google's test publisher in a release build also fails;
        # absent is legal and warns that the release ships with ads off.
        - admob
      flutter: 3.47.3
      vars:
        PACKAGE_NAME: "com.youssefsafwat.mali"
    scripts:
      - name: Flutter pub get
        working_directory: app
        script: flutter pub get

      - name: Regenerate localizations
        working_directory: app
        script: flutter gen-l10n

      # Audit H-15: the canonical gate runs BEFORE the upload key is materialised
      # and BEFORE the release AAB is built, so a mandatory-gate failure makes the
      # keystore, the signed build, the signer inspection, and any Play upload
      # unreachable (Codemagic aborts on a non-zero step). The release AAB build
      # below is itself the mandatory Android *release* compile; the auto-triggered
      # quality workflow independently proves the Android *debug* compile on every
      # push, so no redundant debug build is added here.
      - name: Canonical gates (tools/ci_gates.sh, strict) — REQUIRED before signing
        script: |
          set -eu
          if ! command -v deno >/dev/null 2>&1; then
            curl -fsSL https://deno.land/install.sh | sh
            export PATH="$HOME/.deno/bin:$PATH"
          fi
          ( cd admin && npm ci )
          # The canonical gate runs with the Supabase build credentials UNSET.
          #
          # They belong to the build step, not to a code-correctness gate. With
          # them visible here the skip/ignore manifest fails honestly and
          # unhelpfully: the workflow supplies SUPABASE_URL and
          # SUPABASE_ANON_KEY but no SUPABASE_SERVICE_ROLE_KEY, so the
          # `supabaseServiceRole` group is half-configured and the checker
          # rejects it with "configure all or none" — which is the rule working,
          # not a false positive. Unsetting them makes this step see the same
          # credential state it sees locally and on GitHub, where the manifest is
          # satisfied. The manifest keeps every tooth: an unexpected skip, a
          # changed reason, a stale pattern or a re-quarantined known failure all
          # still fail. The build step below is untouched and still receives the
          # real values.
          env -u SUPABASE_URL -u SUPABASE_ANON_KEY -u SUPABASE_SERVICE_ROLE_KEY \
            REQUIRE_ALL_GATES=1 bash tools/ci_gates.sh

      - name: Assert production Supabase config
        script: |
          set -e
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: SUPABASE_URL / SUPABASE_ANON_KEY are empty — a production"
            echo "build must never ship without a real backend (stub-auth risk)."
            exit 1
          fi
          # Android-ONLY gate. Sign in with Apple is iOS-only and there is no
          # guest path, so Google is the sole way into the app on Android. An
          # empty GOOGLE_SERVER_CLIENT_ID means the plugin is never asked for an
          # id token and every sign-in fails — a shippable artifact nobody can
          # log into. Fail the build instead of discovering it in the store.
          if [ -z "${GOOGLE_SERVER_CLIENT_ID:-}" ]; then
            echo "ERROR: GOOGLE_SERVER_CLIENT_ID is empty — Android's only"
            echo "sign-in path would be dead in the shipped build."
            exit 1
          fi

      - name: Materialise upload keystore (ephemeral)
        script: |
          set -eu
          # Google Play App Signing model: Play holds the APP SIGNING key; this
          # materialises the UPLOAD key only. The decoded keystore is written to
          # the ephemeral CI workspace (never the repository, never a fixed
          # machine path) and is discarded with the runner.
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "ERROR: missing Android release signing input(s):$missing"
            echo "A release build must never be signed with the debug key, so this fails here."
            exit 1
          fi
          KEYSTORE_PATH="${CM_BUILD_DIR}/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          # Sanity-check the decode produced a real keystore, without printing it.
          [ -s "$KEYSTORE_PATH" ] || { echo "ERROR: decoded keystore is empty"; exit 1; }
          # Export the path only (no secret values are ever echoed).
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$CM_ENV"
          echo "Upload keystore materialised at the build workspace (path exported; no values printed)."

      - name: Build release App Bundle
        working_directory: app
        script: |
          # AdMob (R7 A3): ADMOB_APP_ID_ANDROID is read from the environment by
          # Gradle for the manifest placeholder, and passed to Dart as well so
          # the eligibility gate agrees with the manifest. Absent ⇒ no ads.
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}" \
            --dart-define=SUPABASE_ENV=production \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}" \
            --dart-define=LEGAL_BASE_URL="${LEGAL_BASE_URL:-}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=APP_VERSION="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)" \
            --dart-define=ADMOB_APP_ID_ANDROID="${ADMOB_APP_ID_ANDROID:-}" \
            --dart-define=ADMOB_INTERSTITIAL_ANDROID="${ADMOB_INTERSTITIAL_ANDROID:-}" \
            --dart-define=ADMOB_BANNER_ANDROID="${ADMOB_BANNER_ANDROID:-}"

      # §13 — never ship an artifact whose signer was not checked. Cheap, and it
      # would catch a debug-signed or unsigned bundle before it reaches Play.
      - name: Inspect release artifact signer
        working_directory: app
        script: |
          set -eu
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -f "$AAB" || { echo "ERROR: no AAB produced"; exit 1; }
          SIGNER="$(jarsigner -verify -verbose:summary -certs "$AAB" | grep -m1 'X.509' || true)"
          echo "Signer: ${SIGNER:-<none>}"
          jarsigner -verify "$AAB" >/dev/null || { echo "ERROR: AAB is not signed"; exit 1; }
          # A debug-signed upload is rejected by Play and must never get that far.
          if printf '%s' "$SIGNER" | grep -q 'Android Debug'; then
            echo "ERROR: artifact is signed with the Android DEBUG certificate"
            exit 1
          fi
          echo "Release artifact signature verified (not debug-signed)."

      - name: Shred materialised keystore
        script: |
          set -eu
          # Belt-and-braces: the runner is ephemeral, but never leave key
          # material lying around for later steps or cached workspaces.
          rm -f "${CM_BUILD_DIR}/upload-keystore.jks" || true
          echo "Materialised keystore removed."
    artifacts:
      - app/build/**/outputs/bundle/**/*.aab
      - app/build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - youssefsafwat1278@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 4) BACKEND + QUALITY GATES (no device build). Closes the CI gaps flagged by
  #    MALI-036: SQL/migration safety, Edge-function tests, and admin panel.
  # ---------------------------------------------------------------------------
  backend-and-quality-gates:
    name: Backend & Quality Gates
    instance_type: mac_mini_m2
    # Raised from 90 when the iOS compile gate was added: this workflow now runs
    # the canonical gates plus TWO full native builds.
    max_build_duration: 120
    # Audit H-16: this workflow (which holds the ONLY Android compile coverage)
    # must run AUTOMATICALLY on the pre-release development path — never behind a
    # human pressing "Run". It stays quality-only: no signing key, no production
    # AdMob, no store upload, so it is safe to trigger on push/PR. Pure-docs
    # changes are excluded so an Android build is not spent on a README edit.
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
        - pattern: develop
          include: true
        - pattern: 'feat/*'
          include: true
      cancel_previous_builds: true
    # `when` is a WORKFLOW-level key and a SIBLING of `triggering`, never a child
    # of it. Nested inside, Codemagic rejects the whole file with
    # "backend-and-quality-gates -> triggering -> when: extra fields not
    # permitted" — the build never starts, so nothing here runs at all.
    # Behaviour is unchanged by the move: pure-documentation changesets are still
    # skipped so an Android + iOS build is not spent on a README edit.
    when:
      changeset:
        excludes:
          - 'docs/**'
          - '**/*.md'
    environment:
      flutter: 3.47.3
      # JDK 17 is what the project actually requires (sourceCompatibility /
      # targetCompatibility VERSION_17, jvmTarget JVM_17) and what AGP 9 needs.
      # Pinned so the Android compile gate below reproduces the locally-proven
      # toolchain instead of whatever the image happens to ship.
      java: 17
    scripts:
      # Audit H-15/CI-02 + requirement 4: ONE canonical authority. Instead of a
      # hand-maintained subset of gates, run tools/ci_gates.sh — the same script
      # GitHub Actions runs — so the two paths can never drift. Prereqs (deno,
      # admin deps, flutter packages) are set up first; REQUIRE_ALL_GATES=1 makes
      # a tool-missing stage FATAL, so this can never hollow-pass.
      - name: Canonical gates (tools/ci_gates.sh, strict)
        script: |
          set -eu
          if ! command -v deno >/dev/null 2>&1; then
            curl -fsSL https://deno.land/install.sh | sh
            export PATH="$HOME/.deno/bin:$PATH"
          fi
          ( cd admin && npm ci )      # ci_gates runs the admin authorization suite
          ( cd app && flutter pub get )
          # The canonical gate runs with the Supabase build credentials UNSET.
          #
          # They belong to the build step, not to a code-correctness gate. With
          # them visible here the skip/ignore manifest fails honestly and
          # unhelpfully: the workflow supplies SUPABASE_URL and
          # SUPABASE_ANON_KEY but no SUPABASE_SERVICE_ROLE_KEY, so the
          # `supabaseServiceRole` group is half-configured and the checker
          # rejects it with "configure all or none" — which is the rule working,
          # not a false positive. Unsetting them makes this step see the same
          # credential state it sees locally and on GitHub, where the manifest is
          # satisfied. The manifest keeps every tooth: an unexpected skip, a
          # changed reason, a stale pattern or a re-quarantined known failure all
          # still fail. The build step below is untouched and still receives the
          # real values.
          env -u SUPABASE_URL -u SUPABASE_ANON_KEY -u SUPABASE_SERVICE_ROLE_KEY \
            REQUIRE_ALL_GATES=1 bash tools/ci_gates.sh

      # ── Android compile gate (R8C) ─────────────────────────────────────────
      # Android compilation used to happen ONLY in `android-release`: on release
      # day, behind the real signing inputs. So a plugin/Gradle defect stayed
      # invisible until the worst possible moment — which is exactly how the
      # file_picker x AGP-9 failure survived:
      #     GeneratedPluginRegistrant: cannot find symbol FilePickerPlugin
      # A debug APK is the cheapest artifact that still exercises the whole
      # meaningful chain: Gradle 9.1.0, AGP 9.0.1, Kotlin 2.3.20, javac,
      # GeneratedPluginRegistrant, native plugins, sqlite3mc via the NDK and
      # manifest merge. It needs NO signing key, NO production AdMob ids and NO
      # backend. The real signed AAB stays in `android-release`.
      - name: Android compile gate (debug APK - no signing, no prod config)
        working_directory: app
        script: |
          set -eu

          # The vendored file_picker fork carries the AGP-9 registration fix. If
          # resolution ever silently falls back to pub.dev the patch is gone and
          # this gate is worthless, so fail loudly rather than build the wrong
          # dependency.
          grep -q 'path: ../third_party/file_picker' pubspec.yaml || {
            echo "ERROR: file_picker is not wired to the vendored fork."
            echo "See third_party/file_picker/QIRSH_FORK.md."
            exit 1
          }

          # NDK is required because the encrypted SQLite backend (sqlite3mc) is
          # built as a native asset. Install the pinned version if the image does
          # not already carry it.
          NDK_VERSION="28.2.13676358"
          if [ ! -d "${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}/ndk/$NDK_VERSION" ]; then
            echo "Installing NDK $NDK_VERSION"
            yes | sdkmanager --install "ndk;$NDK_VERSION" >/dev/null
          fi

          flutter build apk --debug

          # Prove the artifact exists rather than trusting the exit code alone.
          test -f build/app/outputs/flutter-apk/app-debug.apk \
            || { echo "ERROR: debug APK missing after a 'successful' build"; exit 1; }
          echo "Android compile gate passed (debug APK produced)."

      # ── iOS compile gate (RB-7, iOS half) ──────────────────────────────────
      # Added 2026-09-03 after the iOS app was found UNBUILDABLE by the first
      # compile ever attempted in this repository:
      #     Cannot find 'SharedOfferIntentStore' in scope
      #     ios/ShareBankMessage/ShareViewController.swift:47
      # Both copies of the file existed and were correct; neither had ever been
      # added to a target in project.pbxproj, so nothing compiled them. That is
      # the same defect class, in the same feature, as the Android package bug —
      # and it survived for the same reason: nothing here compiled iOS, because
      # BOTH Xcode workflows are manual-only.
      #
      # --no-codesign is the point: this needs no signing identity, no
      # provisioning profile and no Apple portal access, all of which are
      # currently blocked. It still exercises CocoaPods resolution, the Swift
      # compiler across Runner AND the share extension, GeneratedPluginRegistrant
      # and every plugin's iOS unit. The signed IPA stays in the ios-* workflows.
      - name: iOS compile gate (unsigned - no signing identity required)
        working_directory: app
        script: |
          set -eu
          flutter build ios --debug --no-codesign

          # Prove the artifact exists rather than trusting the exit code alone.
          test -d build/ios/iphoneos/Runner.app \
            || { echo "ERROR: Runner.app missing after a 'successful' build"; exit 1; }

          # The share extension is a SEPARATE binary and the defect that
          # motivated this gate was inside it. A Runner.app without the embedded
          # appex means the extension silently did not build.
          test -d build/ios/iphoneos/Runner.app/PlugIns/ShareBankMessage.appex \
            || { echo "ERROR: ShareBankMessage.appex not embedded"; exit 1; }
          echo "iOS compile gate passed (unsigned Runner.app + embedded appex)."
    publishing:
      email:
        recipients:
          - youssefsafwat1278@gmail.com
        notify:
          success: true
          failure: true

  # Personal iOS branch: manually select ios-signed for internal TestFlight.
  ios-signed:
    name: iOS Signed
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic_asc_api_key   # name of the ASC API key in Codemagic
    environment:
      groups:
        - supabase
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.youssefsafwat.mali
      flutter: 3.47.3
      xcode: latest
      cocoapods: default
      vars:
        IOS_BUILD_NUMBER_FLOOR: "134"
        QIRSH_GOOGLE_AUTH_ENABLED: "true"
        QIRSH_EMAIL_AUTH_ENABLED: "true"
        QIRSH_ALTERNATE_SIGNUP_ENABLED: "true"
        IOS_RELEASE_IPA: "app/build/ios/ipa/money_companion-signed.ipa"
    scripts:
      - name: Verify approved immutable CI revision
        script: |
          set -eu
          [ "${CM_BRANCH:-}" = "release/ios-beta1-personal-20261013" ]
          : "${EXPECTED_REVIEWED_CI_SHA:?Set the independently reviewed full CI commit SHA}"
          [ "${CM_COMMIT:-}" = "$EXPECTED_REVIEWED_CI_SHA" ]
          case "$EXPECTED_REVIEWED_CI_SHA" in
            *[!0-9a-f]*|'') echo "ERROR: invalid reviewed SHA"; exit 1 ;;
          esac
          [ "${#EXPECTED_REVIEWED_CI_SHA}" -eq 40 ]
          [ "$(git rev-parse HEAD)" = "$EXPECTED_REVIEWED_CI_SHA" ]
          [ -z "$(git status --porcelain --untracked-files=no)" ]
          python3 - <<'PYCODE'
          import pathlib, re
          paths = ['app/lib/main.dart', 'app/lib/core/backend/supabase_config.dart',
                   'app/lib/features/onboarding/auth_screen.dart', 'app/ios/Runner/Runner.entitlements',
                   'app/ios/ShareBankMessage/ShareBankMessage.entitlements']
          for path in paths:
              assert not re.search(r'f2qa|QaNetworkOverride|qa_email_auth|127\.0\.0\.1:55321', pathlib.Path(path).read_text()), 'isolated QA source rejected'
          PYCODE

      - name: Flutter pub get
        working_directory: app
        script: flutter pub get

      - name: Resolve next iOS build number from App Store Connect
        script: |
          set -eu
          MARKETING_VERSION="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)"
          [ -n "$MARKETING_VERSION" ] || {
            echo "ERROR: could not read the marketing version from app/pubspec.yaml."
            exit 1
          }

          APP_JSON="$(app-store-connect apps list --silent --json \
            --bundle-id-identifier com.youssefsafwat.mali \
            --strict-match-identifier)"
          APP_STORE_APPLE_ID="$(printf '%s' "$APP_JSON" | python3 -c 'import json, sys; payload = json.load(sys.stdin); items = payload if isinstance(payload, list) else payload.get("data", []); ids = [str(item.get("id", "")) for item in items if item.get("id")]; len(ids) == 1 or sys.exit(f"expected exactly one App Store Connect app, found {len(ids)}"); print(ids[0])')"

          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-build-number \
            --silent --platform IOS --version-string "$MARKETING_VERSION" \
            "$APP_STORE_APPLE_ID")"
          case "$LATEST_BUILD_NUMBER" in
            ''|*[!0-9]*)
              echo "ERROR: App Store Connect did not return a numeric build number."
              exit 1
              ;;
          esac
          IOS_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          # Optional floor above direct-device builds already on the phone.
          case "${IOS_BUILD_NUMBER_FLOOR:-}" in
            '') ;;
            *[!0-9]*) echo "ERROR: IOS_BUILD_NUMBER_FLOOR must be numeric."; exit 1 ;;
            *) [ "$IOS_BUILD_NUMBER" -ge "$IOS_BUILD_NUMBER_FLOOR" ] || IOS_BUILD_NUMBER="$IOS_BUILD_NUMBER_FLOOR" ;;
          esac
          printf 'IOS_MARKETING_VERSION=%s\nIOS_BUILD_NUMBER=%s\n' \
            "$MARKETING_VERSION" "$IOS_BUILD_NUMBER" >> "$CM_ENV"
          echo "App Store Connect preflight: $MARKETING_VERSION ($LATEST_BUILD_NUMBER) exists; building ($IOS_BUILD_NUMBER)."

      - name: Canonical gates (tools/ci_gates.sh, strict) — REQUIRED before signing
        script: |
          set -eu
          if ! command -v deno >/dev/null 2>&1; then
            curl -fsSL https://deno.land/install.sh | sh
            export PATH="$HOME/.deno/bin:$PATH"
          fi
          ( cd admin && npm ci )
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db 2>/dev/null || true
          env -u SUPABASE_URL -u SUPABASE_ANON_KEY -u SUPABASE_SERVICE_ROLE_KEY \
            REQUIRE_ALL_GATES=1 bash tools/ci_gates.sh

      - name: Set up provisioning profiles
        script: |
          set -eu
          python3 - <<'PYCODE'
          import datetime, pathlib, plistlib, subprocess
          expected = {'com.youssefsafwat.mali', 'com.youssefsafwat.mali.ShareBankMessage'}
          found = set()
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          for path in (pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles').glob('*.mobileprovision'):
              profile = plistlib.loads(subprocess.check_output(['security', 'cms', '-D', '-i', str(path)], stderr=subprocess.DEVNULL))
              ent = profile['Entitlements']
              appid = ent.get('application-identifier', '')
              bundle = appid.removeprefix('5TWARK8A23.')
              if bundle not in expected:
                  continue
              assert profile.get('TeamIdentifier') == ['5TWARK8A23'], 'wrong signing team'
              assert profile['ExpirationDate'] > now, 'expired provisioning profile'
              assert not profile.get('ProvisionedDevices') and not profile.get('ProvisionsAllDevices'), 'not App Store distribution'
              assert ent.get('get-task-allow') is False, 'development profile rejected'
              assert 'group.com.youssefsafwat.mali' in ent.get('com.apple.security.application-groups', []), 'missing shared App Group'
              assert any(value in ent.get('keychain-access-groups', []) for value in ['5TWARK8A23.*', '5TWARK8A23.com.youssefsafwat.mali.shared']), 'missing shared Keychain permission'
              if bundle == 'com.youssefsafwat.mali':
                  assert ent.get('aps-environment') == 'production', 'APNs distribution entitlement missing'
                  assert ent.get('com.apple.developer.applesignin') == ['Default'], 'Apple sign-in entitlement missing'
              found.add(bundle)
          assert found == expected, 'both existing Main and Share App Store profiles must be installed'
          print('Existing Main + Share App Store profile identity and entitlements verified.')
          PYCODE
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Assert production Supabase config
        script: |
          set -eu
          [ "${SUPABASE_URL:-}" = "https://rjwphwsefnuotpbtuycf.supabase.co" ] || {
            echo "ERROR: production backend identity mismatch."
            exit 1
          }
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: SUPABASE_URL / SUPABASE_ANON_KEY are empty — a production"
            echo "build must never ship without a real backend (stub-auth risk)."
            exit 1
          fi

      - name: Materialise AdMob release config (native)
        working_directory: app
        script: |
          if [ -n "${ADMOB_APP_ID_IOS:-}" ]; then
            printf 'ADMOB_APP_ID_IOS=%s\n' "$ADMOB_APP_ID_IOS" > ios/Flutter/AdMob.xcconfig
            echo "AdMob iOS app id supplied to the native build (value not printed)."
          else
            rm -f ios/Flutter/AdMob.xcconfig
            echo "No ADMOB_APP_ID_IOS provided — building with ads unconfigured (fail closed)."
          fi

      - name: Build signed IPA
        working_directory: app
        script: |
          set -eu
          rm -rf build/ios/ipa
          flutter build ipa --release \
            --build-name="$IOS_MARKETING_VERSION" \
            --build-number="$IOS_BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}" \
            --dart-define=SUPABASE_ENV=production \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}" \
            --dart-define=LEGAL_BASE_URL="${LEGAL_BASE_URL:-}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=QIRSH_GOOGLE_AUTH_ENABLED="${QIRSH_GOOGLE_AUTH_ENABLED:-false}" \
            --dart-define=QIRSH_EMAIL_AUTH_ENABLED="${QIRSH_EMAIL_AUTH_ENABLED:-false}" \
            --dart-define=QIRSH_ALTERNATE_SIGNUP_ENABLED="${QIRSH_ALTERNATE_SIGNUP_ENABLED:-true}" \
            --dart-define=APP_VERSION="$IOS_MARKETING_VERSION" \
            --dart-define=ADMOB_APP_ID_IOS="${ADMOB_APP_ID_IOS:-}" \
            --dart-define=ADMOB_INTERSTITIAL_IOS="${ADMOB_INTERSTITIAL_IOS:-}" \
            --dart-define=ADMOB_BANNER_IOS="${ADMOB_BANNER_IOS:-}" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Resolve, stamp, and verify the EXACT signed IPA — REQUIRED before submit
        working_directory: app
        script: |
          set -eu
          IPA_DIR="$CM_BUILD_DIR/app/build/ios/ipa"
          CANDIDATE="$(bash ../tools/verify_ios_release_artifact.sh --resolve-only "$IPA_DIR")"
          PUBLISH_DIR="$(cd "$(dirname "$CM_BUILD_DIR/$IOS_RELEASE_IPA")" && pwd -P)"
          IPA="$PUBLISH_DIR/$(basename "$IOS_RELEASE_IPA")"
          SHA_BEFORE_MOVE="$(shasum -a 256 "$CANDIDATE" | awk '{print $1}')"
          if [ "$CANDIDATE" != "$IPA" ]; then
            [ ! -e "$IPA" ] || { echo "ERROR: canonical IPA path already exists: $IPA"; exit 1; }
            mv "$CANDIDATE" "$IPA"
          fi
          SHA_AFTER_MOVE="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          [ "$SHA_AFTER_MOVE" = "$SHA_BEFORE_MOVE" ] || {
            echo "ERROR: signed IPA bytes changed while assigning the publication path."
            exit 1
          }
          bash ../tools/stamp_ios_provenance.sh "$IPA"
          bash ../tools/verify_ios_release_artifact.sh "$IPA" > "${IPA}.verification.txt"
          shasum -a 256 "$IPA" > "${IPA}.sha256"
          python3 - "$IPA" > "${IPA}.signing-verification.txt" <<'PYCODE'
          import hashlib, os, pathlib, plistlib, subprocess, sys, tempfile, zipfile
          with tempfile.TemporaryDirectory() as tmp:
              zipfile.ZipFile(sys.argv[1]).extractall(tmp)
              apps = list((pathlib.Path(tmp) / 'Payload').glob('*.app'))
              assert len(apps) == 1
              main = apps[0]
              info = plistlib.loads((main / 'Info.plist').read_bytes())
              assert info['CFBundleShortVersionString'] == os.environ['IOS_MARKETING_VERSION']
              assert info['CFBundleVersion'] == os.environ['IOS_BUILD_NUMBER']
              signing_certificates = []
              for app, bundle in [(main, 'com.youssefsafwat.mali'), (main / 'PlugIns/ShareBankMessage.appex', 'com.youssefsafwat.mali.ShareBankMessage')]:
                  info = plistlib.loads((app / 'Info.plist').read_bytes())
                  assert info['CFBundleIdentifier'] == bundle
                  subprocess.run(['codesign', '--verify', '--deep', '--strict', str(app)], check=True, capture_output=True)
                  signed = plistlib.loads(subprocess.check_output(['codesign', '-d', '--entitlements', ':-', str(app)], stderr=subprocess.DEVNULL))
                  profile = plistlib.loads(subprocess.check_output(['security', 'cms', '-D', '-i', str(app / 'embedded.mobileprovision')], stderr=subprocess.DEVNULL))
                  ent = profile['Entitlements']
                  assert profile.get('TeamIdentifier') == ['5TWARK8A23']
                  for data in [signed, ent]:
                      assert data.get('application-identifier') == '5TWARK8A23.' + bundle
                      assert data.get('com.apple.developer.team-identifier') == '5TWARK8A23'
                      assert data.get('get-task-allow') is False
                      assert 'group.com.youssefsafwat.mali' in data.get('com.apple.security.application-groups', [])
                      assert any(value in data.get('keychain-access-groups', []) for value in (['5TWARK8A23.com.youssefsafwat.mali.shared'] if data is signed else ['5TWARK8A23.*', '5TWARK8A23.com.youssefsafwat.mali.shared']))
                      if app == main:
                          assert data.get('aps-environment') == 'production'
                          assert data.get('com.apple.developer.applesignin') == ['Default']
                  assert not profile.get('ProvisionedDevices') and not profile.get('ProvisionsAllDevices')
                  prefix = pathlib.Path(tmp) / ('certificate-' + bundle)
                  subprocess.run(['codesign', '-d', '--extract-certificates=' + str(prefix), str(app)], check=True, capture_output=True)
                  certificate = pathlib.Path(str(prefix) + '0').read_bytes()
                  assert certificate in profile['DeveloperCertificates'], 'signature certificate not permitted by profile'
                  signing_certificates.append(hashlib.sha256(certificate).hexdigest())
                  print(bundle + ': distribution signature, Team, App Group and shared Keychain verified')
              assert len(set(signing_certificates)) == 1, 'Main and Share must use the same distribution certificate'
              print('Shared distribution certificate SHA256: ' + signing_certificates[0])
          PYCODE
    artifacts:
      - $IOS_RELEASE_IPA
      - ${IOS_RELEASE_IPA}.provenance
      - ${IOS_RELEASE_IPA}.verification.txt
      - ${IOS_RELEASE_IPA}.sha256
      - ${IOS_RELEASE_IPA}.signing-verification.txt
    publishing:
      # Upload the internal-only IPA to App Store Connect. The separate
      # submit_to_testflight action requests external beta review, which Apple
      # rejects for builds exported with testFlightInternalTestingOnly.
      app_store_connect:
        auth: integration
        submit_to_testflight: false
