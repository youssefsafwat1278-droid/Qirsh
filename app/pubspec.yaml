name: money_companion
description: "تطبيق عربي لتتبع المصاريف تلقائياً من رسائل البنك — Arabic-first, on-device."
publish_to: "none"
version: 1.0.0+44

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & DI
  flutter_riverpod: ^2.5.1
  # Routing
  go_router: ^14.2.0
  # Icons (Design System). Fonts are BUNDLED (see `flutter: fonts:` below) — the
  # runtime `google_fonts` package was removed in B2-D so the app never fetches
  # typography over the network.
  lucide_icons: ^0.257.0
  # i18n
  # Pinned to match whatever `flutter_localizations` pins for the SDK in use —
  # the exact pin is not a product decision, it is Flutter's own constraint.
  # Flutter 3.47's flutter_localizations requires ^0.20.3, so 0.20.2 no longer
  # resolves.
  intl: ^0.20.3
  drift: ^2.18.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: 2.5.5
  path: ^1.9.1
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.17
  supabase_flutter: ^2.8.3
  postgrest: ^2.7.1
  cryptography: ^2.7.0
  crypto: ^3.0.7
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.1
  video_player: ^2.11.1
  share_plus: ^10.1.4
  archive: ^4.0.9
  csv: ^8.0.0
  # VENDORED FORK — see third_party/file_picker/QIRSH_FORK.md.
  # Upstream 11.0.3 + one backported AGP-9 plugin-registration fix. Upstream
  # 11.x skips the Kotlin plugin on AGP 9 assuming built-in Kotlin, but the
  # Flutter template sets android.builtInKotlin=false, so FilePickerPlugin.kt
  # never compiled and every Android build failed. file_picker 12 fixes it but
  # drags win32 ^6 -> share_plus 13 -> flutter_secure_storage 10 (the SQLCipher
  # key store). Remove this fork per the removal condition in QIRSH_FORK.md.
  file_picker:
    path: ../third_party/file_picker
  sign_in_with_apple: ^6.1.0
  sentry_flutter: ^9.22.0
  local_auth: ^2.3.0
  http: ^1.2.2
  native_glass_navbar:
    path: packages/native_glass_navbar
  pdf: ^3.12.0
  printing: ^5.14.3
  google_mobile_ads: 9.0.0
  # Pinned EXACTLY (prerelease): reviewed at 0.2.0-dev.4 — a ^dev range can
  # silently pull a materially different dev build. Update = deliberate bump
  # + visual/perf regression pass (see docs/LIQUID_GLASS_PACKAGE.md).
  liquid_glass_renderer: 0.2.0-dev.4
  # dio: ^5.5.0
  # flutter_local_notifications: ^17.2.0
  # timezone: ^0.9.4
  # rive: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device runtime QA. Drives the real app from inside Dart, so journeys can
  # be exercised without macOS Accessibility or a simulator — the iOS 26.5
  # simulator on this machine fails Apple's own scene-create watchdog.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Used by test/architecture/ci_release_gate_authority_test.dart to parse
  # codemagic.yaml STRUCTURALLY (not via fragile whitespace scans). Declared
  # directly so a transitive-dependency change can never break the CI-authority
  # contract test.
  yaml: ^3.1.2
  # لاختبار مسار إجراءات الإشعار الخلفية عبر PathProviderPlatform وهمي.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4
  # ── codegen (يُفعّل عند تحويل الموديلات إلى freezed) ──
  build_verify: ^3.1.0

flutter:
  uses-material-design: true
  generate: true
  # MaliGlass Tier 3 (EXPERIMENTAL, /design gallery only) — loaded lazily via
  # FragmentProgram.fromAsset when the gallery demo is opened; never at startup.
  shaders:
    - shaders/liquid_glass.frag
  assets:
    - assets/logo/logo_light.png
    - assets/logo/logo_dark.png
    - assets/brand/symbol_green_light.png
    - assets/brand/symbol_green_dark.png
    - assets/qirsh/
    - assets/flags/
    - assets/brands/
    - assets/catalog/
    - assets/fonts/
    - assets/textures/
    - assets/photos/
    - assets/shortcut_guide/
    - assets/illustrations/
    - assets/illustrations/dark/
  # IBM Plex Sans Arabic is the PRIMARY app family (SIL OFL 1.1, bundled) — a
  # UI-first face with harmonised Arabic/Latin and clear figures, and the SAME
  # family the PDF report renderer draws with, so app and export match.
  # Vazirmatn + Alexandria stay bundled as fallbacks. Every family is
  # weight-mapped Regular→400 / Medium→500 / SemiBold→600 / Bold→700.
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    # B2-C/D — Alexandria stays BUNDLED (SIL OFL 1.1) as the first fallback so
    # the app renders its typography offline, with no runtime GoogleFonts fetch.
    # ONE family, weight-mapped Regular→400 / Medium→500 / SemiBold→600 / Bold→700.
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700
    # `--f-mono` from the design prototype: IBM Plex Mono, for technical and
    # monospaced detail strings only (card-network badges, build/version lines,
    # report page numbers and rank positions). BUNDLED (SIL OFL 1.1, licence in
    # assets/fonts/IBMPlexMono-OFL.txt) — the app never fetches type over a
    # network. Latin-only by design, so AppTypography.mono falls back to the UI
    # family for Arabic; see the typography contract test.
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
    # The PRIMARY UI family (see the note above). The PDF renderer loads these
    # same TTF bytes directly, so the exported report matches the screen.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

  # json_serializable: ^6.8.0
  # mocktail: ^1.0.0
