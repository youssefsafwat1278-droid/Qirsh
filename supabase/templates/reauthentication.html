<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Qirsh confirmation code | Qirsh</title>
</head>
<body style="margin:0;background-color:#eef2fa;font-family:Arial,Tahoma,sans-serif;color:#111d3b">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#eef2fa">
    <tr><td align="center" style="padding:28px 14px">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background-color:#ffffff;border:1px solid #dce3f1;border-radius:22px">
        <tr><td align="center" style="background-color:#0a1b46;padding:22px 20px;border-radius:21px 21px 0 0;border-bottom:3px solid #e9b94d">
          <img src="https://qirsh.site/qirsh-coin-blue.png" width="52" height="52" alt="Qirsh" style="display:block;border:0;margin:0 auto 8px">
          <div style="font-size:15px;font-weight:bold;color:#fff;line-height:22px">Qirsh &middot; <span lang="ar">قرش</span></div>
        </td></tr>
        <tr><td align="center" style="padding:26px 20px 20px">
          <h1 style="margin:0 0 8px;font-size:23px;line-height:30px;color:#111d3b">Your Qirsh confirmation code</h1>
          <p style="margin:0 0 16px;color:#43516d;font-size:15px;line-height:23px">Use this code only for the action you requested in Qirsh.<br>
            <span lang="ar" dir="rtl">استخدم الكود للعملية اللي طلبتها في قرش.</span></p>
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:280px">
            <tr><td align="center" dir="ltr" style="padding:16px 8px;background-color:#edf2ff;border:1px solid #dbe5ff;border-radius:12px;color:#132f7d;font-family:Consolas,monospace;font-size:30px;font-weight:bold;letter-spacing:3px;line-height:38px;white-space:nowrap">{{ .Token }}</td></tr>
          </table>
          <p style="margin:15px 0 0;color:#43516d;font-size:13px;line-height:21px">Keep this code private. <span lang="ar" dir="rtl">احتفظ بالكود لنفسك.</span></p>
        </td></tr>
        <tr><td align="center" style="padding:15px 20px;border-top:1px solid #e3e8f4;color:#53617b;font-size:12px;line-height:20px">
          If you didn&rsquo;t request this, you can ignore this email.<br>
          <span lang="ar" dir="rtl">لو ما طلبتش الكود، تقدر تتجاهل الرسالة.</span>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
